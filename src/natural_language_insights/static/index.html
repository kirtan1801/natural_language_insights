<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natural Language Insights</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f7f8; --border: #e3e3e6; --text: #1f1f23; --muted: #6b6b75;
    --user: #2f6fed; --user-text: #ffffff; --bot: #f2f3f5; --accent: #2f6fed;
    --warn-bg: #fff6e0; --warn: #d99a00; --error: #c62828; --code: #f4f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #1f1f23; --border: #33333a; --text: #ececf1; --muted: #9a9aa5;
      --user: #3b6fe0; --bot: #26262c; --warn-bg: #3a3120; --code: #222228;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.55 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: flex; height: 100vh; }

  /* Sidebar */
  .sidebar { width: 270px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  .new-chat { padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); text-align: left; }
  .new-chat:hover { border-color: var(--accent); }
  .chats { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chats-label { font-size: 12px; color: var(--muted); margin: 6px 4px 2px; }
  .chat-link { text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; }
  .chat-link:hover { background: var(--border); }
  .chat-link.active { background: var(--border); }
  .chat-link .title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-link .sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .header { padding: 12px 20px; border-bottom: 1px solid var(--border); font-weight: 600; min-height: 48px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header .sub { font-weight: 400; color: var(--muted); margin-left: 8px; }
  .thread { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .thread-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 100%; padding: 10px 14px; border-radius: 14px; background: var(--bot); overflow-x: auto; }
  .msg.user .bubble { background: var(--user); color: var(--user-text); max-width: 75%; white-space: pre-wrap; }
  .msg.bot .bubble { width: 100%; }
  .bubble p { margin: 0 0 8px; white-space: pre-wrap; }
  .bubble p:last-child { margin-bottom: 0; }
  .status { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dots::after { content: "…"; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .refusal { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: 6px; }
  .error { color: var(--error); }
  .big-number { font-size: 28px; font-weight: 600; margin: 4px 0 8px; }
  .assumptions { font-size: 13px; color: var(--muted); margin: 8px 0 0; padding-left: 18px; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; margin: 6px 0 0; }
  .table-wrap { max-height: 360px; overflow: auto; margin: 8px 0 0; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; }
  .chip:hover { border-color: var(--accent); }

  .welcome { text-align: center; margin: 12vh auto 0; max-width: 520px; }
  .welcome h1 { font-size: 26px; margin: 0 0 8px; }
  .welcome p { color: var(--muted); margin: 0 0 18px; }
  .welcome .chips { justify-content: center; }

  /* Composer */
  .composer-wrap { padding: 12px 16px 18px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
              border: 1px solid var(--border); border-radius: 14px; padding: 8px; background: var(--bg); }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; background: transparent; color: var(--text);
                       max-height: 180px; padding: 6px 4px; }
  .icon-btn { border: 0; background: none; font-size: 18px; padding: 6px 8px; border-radius: 8px; }
  .icon-btn:hover { background: var(--panel); }
  .send { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 7px 14px; }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

  .drop { position: absolute; inset: 0; background: color-mix(in srgb, var(--accent) 12%, transparent);
          border: 2px dashed var(--accent); display: none; align-items: center; justify-content: center;
          font-size: 18px; pointer-events: none; }
  main.dragging .drop { display: flex; }

  @media (max-width: 720px) { .sidebar { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button class="new-chat" id="new-chat">+ New chat</button>
    <div class="chats-label">Chats</div>
    <nav class="chats" id="chats"></nav>
  </aside>

  <main id="main">
    <div class="header" id="header">Natural Language Insights</div>
    <div class="thread" id="thread"><div class="thread-inner" id="messages"></div></div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <input type="file" id="file" accept=".csv,text/csv" hidden>
        <button type="button" class="icon-btn" id="attach" title="Attach a CSV" aria-label="Attach a CSV">📎</button>
        <textarea id="question" rows="1" placeholder="Attach a CSV to start…" aria-label="Question"></textarea>
        <button type="submit" class="send" id="send" disabled>Send</button>
      </form>
      <div class="hint">Answers come from SQL run on your data. Check the SQL and assumptions under each answer.</div>
    </div>
    <div class="drop">Drop a CSV to start a new chat</div>
  </main>
</div>

<script>
const API = "/api/v1";
const $ = (id) => document.getElementById(id);
const STARTERS = ["Give me an overview of this data", "What changed the most over time?"];

let current = null;   // { conversationId, datasetId }
let busy = false;

// ---------- helpers ----------
async function api(path, options = {}) {
  const response = await fetch(API + path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const message = body.error?.message;
    throw new Error(typeof message === "string" ? message : JSON.stringify(message ?? body));
  }
  return body;
}

function escape(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function formatCell(value) {
  if (typeof value === "number" && !Number.isInteger(value)) {
    return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }
  return value ?? "";
}

function formatBytes(bytes) {
  return bytes > 1e6 ? `${(bytes / 1e6).toFixed(1)} MB` : `${Math.ceil(bytes / 1e3)} KB`;
}

// Follows a job over Server-Sent Events; the only timer is the local elapsed-seconds label.
function followJob(jobId, onStatus) {
  return new Promise((resolve, reject) => {
    const source = new EventSource(`${API}/jobs/${jobId}/events`);
    source.addEventListener("status", (event) => {
      const job = JSON.parse(event.data);
      onStatus(job.status);
      if (job.status === "succeeded" || job.status === "failed") {
        source.close();
        resolve(job);
      }
    });
    source.onerror = () => { source.close(); reject(new Error("Lost connection to the server.")); };
  });
}

function scrollToBottom() {
  $("thread").scrollTop = $("thread").scrollHeight;
}

// ---------- messages ----------
function addMessage(role, html) {
  const row = document.createElement("div");
  row.className = `msg ${role}`;
  row.innerHTML = `<div class="bubble">${html}</div>`;
  $("messages").append(row);
  scrollToBottom();
  return row.querySelector(".bubble");
}

function showPending(bubble, label) {
  const started = Date.now();
  let state = label;
  const render = () => {
    bubble.innerHTML = `<div class="status"><span class="dots">${escape(state)}</span>
      <span>${Math.round((Date.now() - started) / 1000)}s</span></div>`;
  };
  render();
  const clock = setInterval(render, 1000);
  return {
    set(next) { state = next; render(); },
    stop() { clearInterval(clock); },
  };
}

function answerHtml(turn) {
  if (turn.status === "failed") return `<p class="error">${escape(turn.error)}</p>`;
  const result = turn.result;
  if (!result.answerable) {
    return `<div class="refusal"><strong>I can't answer that from this data.</strong><br>${escape(result.reason)}</div>`;
  }
  let html = result.explanation ? `<p>${escape(result.explanation)}</p>` : "";
  const single = result.rows.length === 1 && result.columns.length === 1;
  if (single) {
    html += `<div class="big-number">${escape(formatCell(result.rows[0][0]))}</div>`;
  } else if (result.rows.length === 0) {
    html += `<p class="note">The query returned no rows.</p>`;
  } else {
    const numeric = result.columns.map((_, i) => result.rows.every((r) => r[i] === null || typeof r[i] === "number"));
    html += `<div class="table-wrap"><table>
      <thead><tr>${result.columns.map((c, i) => `<th class="${numeric[i] ? "num" : ""}">${escape(c)}</th>`).join("")}</tr></thead>
      <tbody>${result.rows.map((row) => `<tr>${row.map((v, i) => `<td class="${numeric[i] ? "num" : ""}">${escape(formatCell(v))}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
    if (result.truncated) html += `<div class="note">Showing the first ${result.rows.length} rows.</div>`;
  }
  if (result.assumptions?.length) {
    html += `<ul class="assumptions">${result.assumptions.map((a) => `<li>${escape(a)}</li>`).join("")}</ul>`;
  }
  html += `<details><summary>SQL</summary><pre>${escape(result.sql)}</pre></details>`;
  return html;
}

function datasetHtml(dataset, withStarters) {
  const columns = dataset.columns.map((c) => `${escape(c.name)} <span style="opacity:.6">${escape(c.type)}</span>`).join(", ");
  let html = `<p>Loaded <strong>${escape(dataset.filename)}</strong>: ${dataset.row_count.toLocaleString()} rows, ${dataset.columns.length} columns. Ask me anything about it.</p>
    <details><summary>Columns</summary><p style="margin-top:6px">${columns}</p></details>`;
  if (withStarters) {
    html += `<div class="chips">${STARTERS.map((s) => `<button class="chip" data-ask="${escape(s)}">${escape(s)}</button>`).join("")}</div>`;
  }
  return html;
}

// ---------- sidebar ----------
async function renderChats() {
  const chats = await api("/conversations");
  $("chats").innerHTML = chats.map((c) => `
    <button class="chat-link ${current?.conversationId === c.conversation_id ? "active" : ""}" data-chat="${c.conversation_id}">
      <span class="title">${escape(c.title || "New chat")}</span>
      <span class="sub">${escape(c.filename)}</span>
    </button>`).join("") || `<div class="chats-label">No chats yet</div>`;
}

$("chats").addEventListener("click", (event) => {
  const link = event.target.closest("[data-chat]");
  if (link && !busy) openConversation(link.dataset.chat);
});

// ---------- views ----------
async function showWelcome() {
  current = null;
  history.replaceState(null, "", location.pathname);
  $("header").textContent = "Natural Language Insights";
  updateComposer();
  const datasets = (await api("/datasets").catch(() => [])).filter((d) => d.status === "ready");
  $("messages").innerHTML = `<div class="welcome">
      <h1>Ask your data anything</h1>
      <p>Attach a CSV with 📎 (or drop it here), then ask questions in plain English.
         Follow-ups like “what about France?” work too.</p>
      ${datasets.length ? `<p>Or continue with a file you already loaded:</p>
        <div class="chips">${datasets.slice(0, 8).map((d) =>
          `<button class="chip" data-dataset="${d.dataset_id}">${escape(d.filename)}</button>`).join("")}</div>` : ""}
    </div>`;
  renderChats();
}

async function startConversation(datasetId) {
  const conversation = await api("/conversations", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dataset_id: datasetId }),
  });
  setCurrent(conversation);
  renderChats();
  return conversation;
}

function setCurrent(conversation) {
  current = {
    conversationId: conversation.conversation_id,
    datasetId: conversation.dataset_id,
    filename: conversation.filename,
    title: conversation.title,
  };
  history.replaceState(null, "", `#chat=${conversation.conversation_id}`);
  renderHeader();
  updateComposer();
}

function renderHeader() {
  $("header").innerHTML = `${escape(current.title || "New chat")}<span class="sub">${escape(current.filename)}</span>`;
}

async function openConversation(conversationId) {
  let conversation;
  try {
    conversation = await api(`/conversations/${conversationId}`);
  } catch {
    return showWelcome();
  }
  setCurrent(conversation);
  renderChats();
  const dataset = await api(`/datasets/${conversation.dataset_id}`);
  $("messages").innerHTML = "";
  addMessage("bot", datasetHtml(dataset, conversation.turns.length === 0));
  for (const turn of conversation.turns) {
    addMessage("user", escape(turn.question));
    const bubble = addMessage("bot", "");
    if (turn.status === "succeeded" || turn.status === "failed") {
      bubble.innerHTML = answerHtml(turn);
    } else {
      awaitAnswer(turn.job_id, bubble);
    }
  }
  scrollToBottom();
}

// ---------- actions ----------
async function uploadFile(file) {
  if (busy) return;
  if (!file.name.toLowerCase().endsWith(".csv")) {
    addMessage("bot", `<p class="error">Please attach a .csv file.</p>`);
    return;
  }
  current = null;
  history.replaceState(null, "", location.pathname);
  $("header").textContent = "New chat";
  $("messages").innerHTML = "";
  addMessage("user", `📎 ${escape(file.name)} · ${formatBytes(file.size)}`);
  const bubble = addMessage("bot", "");
  const pending = showPending(bubble, "Uploading");
  setBusy(true);
  try {
    const form = new FormData();
    form.append("file", file);
    const { job_id, dataset_id } = await api("/datasets", { method: "POST", body: form });
    pending.set("Reading the file");
    const job = await followJob(job_id, (s) => pending.set(s === "running" ? "Reading the file" : "Queued"));
    if (job.status === "failed") throw new Error(job.error);
    await startConversation(dataset_id);
    pending.stop();
    bubble.innerHTML = datasetHtml(await api(`/datasets/${dataset_id}`), true);
  } catch (error) {
    pending.stop();
    bubble.innerHTML = `<p class="error">${escape(error.message)}</p>`;
  } finally {
    setBusy(false);
    scrollToBottom();
  }
}

async function ask(question) {
  question = question.trim();
  if (!question || !current || busy) return;
  document.querySelectorAll("[data-ask]").forEach((chip) => chip.closest(".chips")?.remove());
  addMessage("user", escape(question));
  const bubble = addMessage("bot", "");
  setBusy(true);
  try {
    const { job_id } = await api(`/conversations/${current.conversationId}/questions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!current.title) { current.title = question.slice(0, 80); renderHeader(); }
    renderChats();
    await awaitAnswer(job_id, bubble);
  } catch (error) {
    bubble.innerHTML = `<p class="error">${escape(error.message)}</p>`;
  } finally {
    setBusy(false);
    $("question").focus();
  }
}

async function awaitAnswer(jobId, bubble) {
  const pending = showPending(bubble, "Thinking");
  try {
    const job = await followJob(jobId, (s) => pending.set(s === "running" ? "Thinking" : "Queued"));
    pending.stop();
    bubble.innerHTML = answerHtml(job);
  } catch (error) {
    pending.stop();
    bubble.innerHTML = `<p class="error">${escape(error.message)}</p>`;
  }
  scrollToBottom();
}

// ---------- composer ----------
function setBusy(value) {
  busy = value;
  updateComposer();
}

function updateComposer() {
  const input = $("question");
  input.disabled = !current;
  input.placeholder = current ? "Ask a question about your data…" : "Attach a CSV to start…";
  $("send").disabled = busy || !current || !input.value.trim();
  $("attach").disabled = busy;
}

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  const question = $("question").value;
  $("question").value = "";
  autoresize();
  ask(question);
});

$("question").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

function autoresize() {
  const input = $("question");
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight}px`;
  updateComposer();
}
$("question").addEventListener("input", autoresize);

$("attach").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (file) uploadFile(file);
});

$("new-chat").addEventListener("click", () => { if (!busy) showWelcome(); });

$("messages").addEventListener("click", async (event) => {
  const chip = event.target.closest("[data-ask], [data-dataset]");
  if (!chip || busy) return;
  if (chip.dataset.ask) return ask(chip.dataset.ask);
  try {
    await startConversation(chip.dataset.dataset);
    openConversation(current.conversationId);
  } catch (error) {
    addMessage("bot", `<p class="error">${escape(error.message)}</p>`);
  }
});

// Drag and drop a CSV anywhere on the chat.
const main = $("main");
main.addEventListener("dragover", (event) => { event.preventDefault(); main.classList.add("dragging"); });
main.addEventListener("dragleave", (event) => { if (!main.contains(event.relatedTarget)) main.classList.remove("dragging"); });
main.addEventListener("drop", (event) => {
  event.preventDefault();
  main.classList.remove("dragging");
  const file = event.dataTransfer.files[0];
  if (file) uploadFile(file);
});

// ---------- start ----------
const initial = new URLSearchParams(location.hash.slice(1)).get("chat");
initial ? openConversation(initial) : showWelcome();
</script>
</body>
</html>
